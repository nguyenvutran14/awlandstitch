<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Budget pricking iron price ladder</title>
<desc id="desc">A price ladder showing a WUTA single head at $8.33, a WUTA one-piece at $14.79, a MOZHE at $22.86, and a WUTA full set at about $162.</desc>
