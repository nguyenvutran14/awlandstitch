<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Two-tooth and eight-tooth wallet stitching combination</title>
<desc id="desc">A two-tooth iron for corners and an eight-tooth iron for straight runs on a wallet panel.</desc>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7efe4" stroke="none" stroke-width="0" opacity="1"/>
<circle cx="1040" cy="120" r="220" fill="#efe2d2" stroke="none" stroke-width="0"/>
    <text x="64" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#5e2f12" text-anchor="start" opacity="1" letter-spacing="3">THE COMBO</text>
    <text x="64" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#241a14" text-anchor="start" opacity="1">2-tooth corners. 8-tooth runs.</text>
    <text x="64" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">The pair that covers most wallet work.</text>
  <rect x="67" y="254" width="1080" height="330" rx="18" fill="#000" stroke="none" stroke-width="0" opacity="0.06"/><rect x="60" y="245" width="1080" height="330" rx="18" fill="#fffaf2" stroke="#d9cbbd" stroke-width="1.5" opacity="1"/>
  <rect x="120" y="300" width="420" height="220" rx="14" fill="#8a4b1f" stroke="none" stroke-width="0" opacity="1"/>
  <path d="M 150 330 L 510 330 L 510 490" fill="none" stroke="#e6c39f" stroke-width="5" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(170 360) rotate(0)"><rect x="-18" y="-18" width="330" height="36" rx="10" fill="#8a4b1f" stroke="none" stroke-width="0" opacity="1"/><circle cx="0" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="42" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="84" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="126" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="168" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="210" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="252" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="294" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><line x1="4" y1="-4" x2="38" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="46" y1="-4" x2="80" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="88" y1="-4" x2="122" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="130" y1="-4" x2="164" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="172" y1="-4" x2="206" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="214" y1="-4" x2="248" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="256" y1="-4" x2="290" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(480 390) rotate(0)"><rect x="-18" y="-18" width="74" height="36" rx="10" fill="#8a4b1f" stroke="none" stroke-width="0" opacity="1"/><circle cx="0" cy="0" r="5" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="38" cy="0" r="5" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><line x1="5" y1="-5" x2="33" y2="5" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/></g>
  <text x="620" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#241a14" text-anchor="start" opacity="1">8-tooth</text>
  <text x="620" y="355" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">Straight runs</text>
  <text x="620" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#241a14" text-anchor="start" opacity="1">2-tooth</text>
  <text x="620" y="445" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">Corners and curves</text>
  <text x="620" y="500" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#241a14" text-anchor="start" opacity="1">Add a 20-tooth later for long runs.</text>
  <text x="60" y="625" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">The 2-tooth head is not a starter gimmick. It is the corner tool.</text>
</svg>
