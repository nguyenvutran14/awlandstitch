<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Pricking iron versus stitching chisel illustration</title>
<desc id="desc">A traditional pricking iron with short teeth beside a stitching chisel with long teeth, with leather cross-sections showing marking versus punching through.</desc>
