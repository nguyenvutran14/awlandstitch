<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Wallet stitching pitch illustration</title>
<desc id="desc">A wallet panel with two stitch lines, one at 3.38mm pitch and one at 3.85mm pitch.</desc>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7efe4" stroke="none" stroke-width="0" opacity="1"/>
<circle cx="1040" cy="120" r="220" fill="#efe2d2" stroke="none" stroke-width="0"/>
    <text x="64" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#5e2f12" text-anchor="start" opacity="1" letter-spacing="3">WALLET SIZING</text>
    <text x="64" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#241a14" text-anchor="start" opacity="1">One wallet panel, two rhythms.</text>
    <text x="64" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">3.38mm for a finer line. 3.85mm for a more open line.</text>
  <rect x="67" y="254" width="1080" height="330" rx="18" fill="#000" stroke="none" stroke-width="0" opacity="0.06"/><rect x="60" y="245" width="1080" height="330" rx="18" fill="#fffaf2" stroke="#d9cbbd" stroke-width="1.5" opacity="1"/>
  <rect x="120" y="290" width="460" height="240" rx="14" fill="#8a4b1f" stroke="none" stroke-width="0" opacity="1"/>
  <rect x="130" y="300" width="440" height="220" rx="10" fill="none" stroke="#e6c39f" stroke-width="1" opacity="0.5"/>
  <g transform="translate(160 345) rotate(0)"><rect x="-18" y="-18" width="378" height="36" rx="10" fill="#8a4b1f" stroke="none" stroke-width="0" opacity="1"/><circle cx="0" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="38" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="76" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="114" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="152" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="190" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="228" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="266" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="304" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="342" cy="0" r="4" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><line x1="4" y1="-4" x2="34" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="42" y1="-4" x2="72" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="80" y1="-4" x2="110" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="118" y1="-4" x2="148" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="156" y1="-4" x2="186" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="194" y1="-4" x2="224" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="232" y1="-4" x2="262" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="270" y1="-4" x2="300" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="308" y1="-4" x2="338" y2="4" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(160 455) rotate(0)"><rect x="-18" y="-18" width="386" height="36" rx="10" fill="#8a4b1f" stroke="none" stroke-width="0" opacity="1"/><circle cx="0" cy="0" r="6" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="50" cy="0" r="6" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="100" cy="0" r="6" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="150" cy="0" r="6" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="200" cy="0" r="6" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="250" cy="0" r="6" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="300" cy="0" r="6" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><circle cx="350" cy="0" r="6" fill="#f7efe4" stroke="#5e2f12" stroke-width="1.5"/><line x1="6" y1="-6" x2="44" y2="6" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="56" y1="-6" x2="94" y2="6" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="106" y1="-6" x2="144" y2="6" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="156" y1="-6" x2="194" y2="6" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="206" y1="-6" x2="244" y2="6" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="256" y1="-6" x2="294" y2="6" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/><line x1="306" y1="-6" x2="344" y2="6" stroke="#c98f5a" stroke-width="2" stroke-linecap="round"/></g>
  <text x="620" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#241a14" text-anchor="start" opacity="1">3.38mm</text>
  <text x="620" y="355" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">Finer, denser, wallet default.</text>
  <text x="620" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#241a14" text-anchor="start" opacity="1">3.85mm</text>
  <text x="620" y="445" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">More open, easier to learn.</text>
  <text x="620" y="500" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#241a14" text-anchor="start" opacity="1">Both are defensible. Pick one and practice.</text>
  <text x="60" y="625" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">The wallet is small enough that 0.47mm of pitch is visible in the finished edge.</text>
</svg>
