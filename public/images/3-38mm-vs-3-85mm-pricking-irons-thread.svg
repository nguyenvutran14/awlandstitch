  <text x="100" y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">usual thread: 0.3â€“0.55mm</text>
  <rect x="100" y="380" width="420" height="90" rx="12" fill="#8a4b1f" stroke="none" stroke-width="0" opacity="1"/>
