<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Wallet thread pairing diagram</title>
<desc id="desc">A pairing chart for 3.38mm and 3.85mm pitches with usual and refined thread ranges.</desc>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7efe4" stroke="none" stroke-width="0" opacity="1"/>
<circle cx="1040" cy="120" r="220" fill="#efe2d2" stroke="none" stroke-width="0"/>
    <text x="64" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#5e2f12" text-anchor="start" opacity="1" letter-spacing="3">WALLET THREAD</text>
    <text x="64" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#241a14" text-anchor="start" opacity="1">Match the thread to the hole.</text>
    <text x="64" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">A tight hole with thick thread looks crowded.</text>
  <rect x="67" y="254" width="1080" height="330" rx="18" fill="#000" stroke="none" stroke-width="0" opacity="0.06"/><rect x="60" y="245" width="1080" height="330" rx="18" fill="#fffaf2" stroke="#d9cbbd" stroke-width="1.5" opacity="1"/>
  <text x="100" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#241a14" text-anchor="start" opacity="1">3.38mm pitch</text>
  <text x="100" y="335" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">Usual: 0.3â€“0.55mm</text>
  <text x="100" y="365" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#241a14" text-anchor="start" opacity="1">Refined: 0.3â€“0.4mm</text>
  <rect x="100" y="400" width="420" height="34" rx="17" fill="#c98f5a" stroke="none" stroke-width="0" opacity="1"/>
  <rect x="100" y="450" width="420" height="22" rx="11" fill="#e6c39f" stroke="none" stroke-width="0" opacity="1"/>
  <text x="560" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#241a14" text-anchor="start" opacity="1">3.85mm pitch</text>
  <text x="560" y="335" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">Usual: 0.55â€“0.8mm</text>
  <text x="560" y="365" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#241a14" text-anchor="start" opacity="1">Refined: 0.55â€“0.6mm</text>
  <rect x="560" y="400" width="420" height="34" rx="17" fill="#8a4b1f" stroke="none" stroke-width="0" opacity="1"/>
  <rect x="560" y="450" width="420" height="22" rx="11" fill="#5e2f12" stroke="none" stroke-width="0" opacity="1"/>
  <text x="60" y="625" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5c4b3f" text-anchor="start" opacity="1">If the thread barely fits, size down the thread before you size up the iron.</text>
</svg>
